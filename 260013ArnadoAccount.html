<!DOCTYPE html>
<html>
<head>
    <title>Chairbnb - Account</title>
    <link rel="stylesheet" href="260013ArnadoEcommerce.css">
</head>

<body>

    <nav>
        <h1>Chairbnb</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="260013ArnadoProducts.html">Furniture</a>
            <a href="260013ArnadoAccount.html">Account</a>
            <a href="260013ArnadoInquiry.html">Contact Us</a>
        </div>
    </nav>

    <section class="account">

        <div class="form-box">

            <h2>Sign In</h2>

            <form onsubmit="signIn(); return false;">

                <label for="loginEmail">Email</label>

                <input type="email"
                       id="loginEmail"
                       placeholder="Enter your email">

                <label for="loginPassword">Password</label>

                <input type="password"
                       id="loginPassword"
                       placeholder="Enter your password">

                <button type="submit">Sign In</button>

            </form>

        </div>


        <div class="form-box">

            <h2>Create Account</h2>

            <form onsubmit="signUp(); return false;">

                <label for="name">Full Name</label>

                <input type="text"
                       id="name"
                       placeholder="Enter your name">

                <label for="signupEmail">Email</label>

                <input type="email"
                       id="signupEmail"
                       placeholder="Enter your email">

                <label for="signupPassword">Password</label>

                <input type="password"
                       id="signupPassword"
                       placeholder="Create a password">

                <label for="confirmPassword">Confirm Password</label>

                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm your password">

                <button type="submit">Sign Up</button>

            </form>

        </div>

    </section>

    <footer>
        <p>&copy; 2026 Chairbnb. All Rights Reserved.</p>
    </footer>

    <script src="260013ArnadoEcommerce.js"></script>

</body>
</html>
